<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapStudy</title><script src="https://cdn.tailwindcss.com"></script></head><body class="p-6 max-w-2xl mx-auto"><h1 class="font-black text-3xl">📚 SnapStudy - Google-like Real Answers!</h1><div class="mt-4 border-2 border-purple-200 rounded-2xl p-4"><input id="q" placeholder="Type: water, fan, photosynthesis" class="w-full border-2 rounded-full px-4 py-3"><button onclick="search()" class="mt-3 w-full bg-black text-white py-3 rounded-full font-bold">Search Real Answer</button><div id="r" class="mt-4 whitespace-pre-wrap text-sm"></div></div><script>async function search(){let q=document.getElementById('q').value.replace(/^(what is|define)\s+/i,'').trim();if(!q)return;document.getElementById('r').innerText='Searching Wikipedia for '+q+'...';try{let res=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(q));if(res.ok){let d=await res.json();if(d.extract){document.getElementById('r').innerText=d.title+' - REAL ANSWER (Like Google!)\n\n'+d.extract+'\n\nSource: Wikipedia';return;}}document.getElementById('r').innerText='Try simpler word like water';}catch(e){document.getElementById('r').innerText='Need internet!';}}</script></body></html>
